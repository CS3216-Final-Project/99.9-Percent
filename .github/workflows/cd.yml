name: CD

# Vercel deploys the frontend and backend itself (Git integration): production on
# every push to main, a preview for every pull request. This workflow does the
# parts Vercel can't: migrate the production database, then check the live API.
#
# Vercel and this workflow start at the same time, so new code can go live a few
# seconds before its migration. Keep migrations backward-compatible: add tables
# and nullable columns first, and drop or rename only in a later PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a migration halfway; queue the next run instead.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Add the DATABASE_URL_UNPOOLED secret (Neon's direct connection string) under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate

  smoke-test:
    name: Check production API
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ vars.API_URL || 'https://99-99-percent-backend.vercel.app' }}
    steps:
      # Retries while Vercel finishes deploying and Neon wakes up from idle.
      - name: API is up and reaches the database
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$API_URL/api/health" && curl -fsS "$API_URL/api/health/db"; then
              echo; echo "Production API OK"; exit 0
            fi
            echo; echo "Attempt $i failed, retrying in 15s"; sleep 15
          done
          echo "::error::$API_URL/api/health/db did not return 200. Check DATABASE_URL in the backend's Vercel settings."
          exit 1
